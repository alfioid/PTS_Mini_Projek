<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BePro - Dashboard Produk UMKM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <div class="logo-icon">🛒</div>
      <span class="brand-title">BePro</span>
    </div>
    <div class="header-right">
      <button class="btn-favorite-nav">
        Favorit <span id="favCountBadge" class="badge">0</span>
      </button>
    </div>
  </header>

  <main class="container">

    <!-- BARIS STATISTIK OTOMATIS (JAVASCRIPT) -->
    <section class="stats-bar">
      <div class="stat-item">
        <strong>Produk Termahal:</strong> <span id="statTermahal">-</span>
      </div>
      <div class="stat-item">
        <strong>Harga Rata-Rata:</strong> <span id="statRataRata">-</span>
      </div>
      <div class="stat-item">
        <strong>Kategori:</strong> <span id="statKategori">-</span>
      </div>
      <div class="toggle-box">
        <button id="btnGrid" class="btn-toggle active" title="Tampilan Grid">Grid ⊞</button>
        <button id="btnList" class="btn-toggle" title="Tampilan List">List ☰</button>
      </div>
    </section>

    <!-- BARIS KONTROL (SEARCH & TOGGLE GRID/LIST) -->
    <section class="controls-bar">
      <div class="search-box">
        <span class="total-label">Total Produk: <span id="totalProdukCount">0</span></span>
        <input type="text" id="searchInput" placeholder="Cari nama produk atau kategori...">
      </div>
    </section>

    <!-- CONTAINER KATALOG PRODUK -->
    <section id="loadingState" class="state-message">Memuat data produk...</section>
    <section id="errorState" class="state-message error-msg" style="display: none;"></section>
    
    <section id="productContainer" class="product-container grid-view"></section>

 <!-- FORM PEMESANAN PRODUK INTERAKTIF -->
    <!-- FORM PEMESANAN PRODUK INTERAKTIF -->
    <section class="form-section">
      <h2>📝 Form Pemesanan Produk UMKM</h2>
      <div id="formAlert" class="alert" style="display: none;"></div>

      <form id="orderForm" novalidate>
        <!-- Nama Pembeli -->
        <div class="form-group row-align">
          <label for="namaInput">Nama Pembeli</label>
          <div class="input-wrapper">
            <input type="text" id="namaInput" placeholder="Masukkan nama pembeli (minimal 5 karakter)">
            <small id="namaError" class="error-text"></small>
          </div>
        </div>

        <!-- Kartu Daftar Item Belanja -->
        <div class="cart-card">
          <div id="cartItemsContainer" class="cart-items-container">
            <!-- Item produk dinamis akan ditambahkan oleh JavaScript di sini -->
          </div>

          <!-- Tombol Tambah Item -->
          <div class="add-item-wrapper">
            <button type="button" id="btnAddCartItem" class="btn-add-item">+ Tambah Produk Lain</button>
          </div>
          <hr class="cart-divider">
          <!-- Ringkasan Total Belanja -->
          <div class="cart-summary-row">
            <div class="summary-label">Total</div>
            <div class="summary-values">
              <span class="total-qty-text">
                <strong id="totalQtyCount">0</strong> barang dibeli
              </span>
              <span class="total-price-text">
                Rp <strong id="grandTotalPrice">0</strong>
              </span>
            </div>
          </div>
        </div>

        <!-- Tombol Submit -->
        <div class="submit-wrapper">
          <button type="submit" class="btn-submit">Kirim Pemesanan</button>
        </div>
      </form>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p><strong>PTS Pemrograman Web 2026</strong> | Muhammad Nur Alfian (NPM: 2440304025) - Teknik Komputer UBT</p>
  </footer>
  <script type="module" src="js/app.js"></script>

</body>
</html>
