<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BePro - Dashboard Produk UMKM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <div class="logo-icon">🛒</div>
      <span class="brand-title">BePro</span>
    </div>
  </header>

  <main class="container">

    <!-- BARIS STATISTIK OTOMATIS (JAVASCRIPT) -->
    <section class="stats-bar">
      <div class="stat-item">
        <strong>Produk Termahal:</strong> <span id="statTermahal">-</span>
      </div>
      <div class="stat-item">
        <strong>Harga Rata-Rata:</strong> <span id="statRataRata">-</span>
      </div>
      <div class="stat-item">
        <strong>Kategori:</strong> <span id="statKategori">-</span>
      </div>
      <div class="stat-item">
        <span class="total-label">Total Produk: <span id="totalProdukCount">0</span></span>
      </div>
      <div class="stat-item">
        <strong>Favorit:</strong> 
        <button type="button" id="btnFavFilter" class="btn-fav-badge" title="Klik untuk filter produk favorit">
          <span id="favCountBadge" class="badge">0</span>
        </button>
      </div>
      <div class="toggle-box">
        <button id="btnGrid" class="btn-toggle active" title="Tampilan Grid">Grid ⊞</button>
        <button id="btnList" class="btn-toggle" title="Tampilan List">List ☰</button>
      </div>
    </section>

    <!-- CONTAINER KATALOG PRODUK -->
    <section id="loadingState" class="state-message">Memuat data produk...</section>
    <section id="errorState" class="state-message error-msg" style="display: none;"></section>
    
    <section id="productContainer" class="product-container grid-view"></section>

<!-- FORM SARAN & MASUKAN PRODUK -->
    <section class="form-section">
      <h2>💬 Form Saran & Masukan UMKM</h2>
      <div id="formAlert" class="alert" style="display: none;"></div>

      <form id="feedbackForm" novalidate>
        <div class="form-group">
          <label for="namaInput">Nama Pengirim *</label>
          <input type="text" id="namaInput" placeholder="Masukkan nama Anda (minimal 5 karakter)">
          <small id="namaError" class="error-text"></small>
        </div>

        <div class="form-group">
          <label for="pesanInput">Pesan / Saran Masukan *</label>
          <textarea id="pesanInput" rows="4" placeholder="Tuliskan saran atau masukan Anda untuk produk UMKM ini..."></textarea>
          <small id="pesanError" class="error-text"></small>
        </div>

        <button type="submit" class="btn-submit">Kirim Saran</button>
      </form>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p><strong>PTS Pemrograman Web 2026</strong> | Muhammad Nur Alfian (NPM: 2440304025) - Teknik Komputer UBT</p>
  </footer>
  <script type="module" src="js/app.js"></script>

</body>
</html>
